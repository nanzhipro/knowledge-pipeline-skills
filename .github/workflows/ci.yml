name: Native Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Runtime details
        run: python -c "import platform,sys; print(sys.version); print(platform.platform()); print(platform.machine())"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check obsidian-llm-wiki/scripts obsidian-llm-wiki/tests
      - run: python -m unittest discover -s obsidian-llm-wiki/tests -v
      - run: python obsidian-llm-wiki/scripts/wiki.py --help

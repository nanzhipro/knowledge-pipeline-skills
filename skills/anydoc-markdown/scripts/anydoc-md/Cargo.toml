[package]
name = "anydoc-md"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local document-to-Markdown bundles powered by Rust anydoc"
repository = "https://github.com/nanzhipro/anydoc-markdown-skill"

[dependencies]
anydoc = "=0.2.4"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = "symbols"
